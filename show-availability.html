<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Choose</title>
 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="theme.css">

      margin: 0;
      font-family: Arial, sans-serif;

       background: linear-gradient(135deg,#7dd 10%, #ffd 70%, #9face6 50%); 
      background-image: url(availability_bg.png);

    body {
  position: relative;
  margin: 0;
  min-height: 100vh;
  /* Remove background-image from here */
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url('availability_bg.jpeg');
  background-size: cover;
  background-position: center;
  opacity: 0.8; /* Adjust this value for your desired opacity */
  z-index: -1;
  pointer-events: none;
}

    /* Top bar across full width */
    .top-bar {
      position: relative;
      width: 100%;
      height:60px;
      /* padding: 15px 40px; space for icons */
      box-sizing: border-box;
      text-align: center;
      background: #ffffff96;
      display:flex;
      align-items: center;
      justify-content: space-between;
    }
    #back-link{
      color:#f32323;
      font-size: 2.2rem;
      margin-left: 5px;
 
    }
    #user-icon{
      color:#f32323;
      font-size: 2.2rem;
      margin-right: 5px;
    }
    .title h2 {
      margin: 0;
      font-size: 1.5rem;
      color: #000;
      letter-spacing: 2px;
    }

    

    /* Form container under top bar */
    .container {
      background: #252b31af;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 10px 12px 15px rgba(104, 13, 13, 0.342);
      width: 100%;
      max-width: 70vw;
      height :70px;
      margin: 0 auto;
      margin-top: 10px;
      position:absolute;
      top:40px;
      left:50%;
      transform: translateX(-50%);
    }

    select {
      width: 100%;
      height:35px;
      padding: 10px;
      border: 2px solid #f32323;
      border-radius: 8px;
      margin-bottom: 5px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #f11717;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #2575fc;
    }
    .requests {
      display:flex;
      position:absolute;
      top:40vh;
      left:50%;
      transform: translateX(-50%);
      width: 90vw;
      background-color: #365fa59d;
    }
  </style>
  <link rel="stylesheet" href="theme.css">

<body>
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="icon left">
        <a href="homep.html" id="back-link">
    <i class="fa-solid fa-arrow-left"></i>
     </a>
    </div>
    <div class="title"><h2>FIND YOUR PARTNER</h2></div>
    <div class="top-right">
      <div class="theme-toggle">
        <label>
          <input type="checkbox" id="theme-switch">
          <span class="switch"></span>
        </label>
        <span class="label-text">Dark mode</span>
      </div>
      <div class="icon right"><a href="#"><i class="fa-solid fa-user" id="user-icon"></i></a></div>
    </div>
  </div>

  <!-- Form Container -->
  <div class="container">
    <select id="college">
      <option value="" disabled selected>-- Choose Your College --</option>
      <option value="Jadavpur University">Jadavpur University</option>
      <option value="RKMGEC">Ram Krishna Mahato Government Engineering College</option>
      <option value="IIT KGP">IIT Kharagpur</option>
      <option value="IIT Delhi">IIT Delhi</option>
      <option value="NIT Trichy">NIT Trichy</option>
      <option value="IIIT Hyderabad">IIIT Hyderabad</option>
      
      <option value="Other">Other</option>
    </select>
    <button onclick="submitCollege()">Submit</button>
  </div>
  <div class="requests">
    <div id="r1"></div>
    <div id="r2"></div>
    <div id="r3"></div> 
    <div id="r4"></div>
    <div id="r5"></div>
    <div id="r6"></div>
  </div>
    <script src="theme.js"></script>
</body>
</html>
