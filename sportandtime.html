                </select>
            </div>
            <div class="form-group">

                <div class="time-picker">

                        <option value="19">19</option>

                        <option value="22">22</option>

                        <option value="24">24</option>
                    </select>
                    :

                        <option value="13">13</option>
                        <option value="14">14</option>
                        <option value="15">15</option>
                        <option value="16">16</option>
                        <option value="17">17</option>
                        <option value="18">18</option>
                        <option value="19">19</option>
                        <option value="20">20</option>
                        <option value="21">21</option>
                        <option value="22">22</option>
                        <option value="23">23</option>
                        <option value="24">24</option>
                        <option value="25">25</option>

                <!-- hidden combined time value in HH:MM (24-hour) -->
                <input type="hidden" id="time" name="time" required>
            </div>
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
    </div>
    <script>
        // combine hour and minute into hidden time input as HH:MM (24-hour)
        (function(){
            const form = document.getElementById('request-form');
            if(!form) return;
            const hour = document.getElementById('hour');
            const minute = document.getElementById('minute');
            const timeHidden = document.getElementById('time');
            function pad(n){ return String(n).padStart(2,'0'); }
            form.addEventListener('submit', function(e){
                // ensure selects have values
                if(!hour.value || !minute.value){
                    e.preventDefault();
                    alert('Please select both hour and minute');
                    return false;
                }
                // If user selects 24 for hour, convert to 00 (midnight next day) or keep 24:00 if desired
                let h = parseInt(hour.value,10);
                if(h === 24) h = 0; // normalize 24 to 00
                timeHidden.value = pad(h) + ':' + pad(minute.value);
                // allow submit to continue
            });
        })();
    </script>

    <script src="theme.js"></script>
